# XcodeGen 설정. 맥에서 `brew install xcodegen` 후 이 폴더에서 `xcodegen generate` 하면 Hikidashi.xcodeproj 가 생긴다.
name: Hikidashi
options:
  bundleIdPrefix: com.kkkougaa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

packages:
  HikidashiCore:
    path: HikidashiCore

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Hikidashi:
    type: application
    platform: iOS
    sources:
      - path: Hikidashi
    dependencies:
      - package: HikidashiCore
    info:
      path: Hikidashi/Info.plist
      properties:
        CFBundleDisplayName: hikidashi
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: com.kkkougaa.hikidashi
            CFBundleURLSchemes: [hikidashi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkkougaa.hikidashi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # 내 아이폰에 설치하려면 Xcode 에서 Signing & Capabilities 의 Team 을 고르면 된다
        DEVELOPMENT_TEAM: ""

  HikidashiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HikidashiUITests
    dependencies:
      - target: Hikidashi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkkougaa.hikidashi.uitests
        TEST_TARGET_NAME: Hikidashi
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hikidashi:
    build:
      targets:
        Hikidashi: all
        HikidashiUITests: [test]
    test:
      targets:
        - HikidashiUITests
