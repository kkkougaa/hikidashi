name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # iOS 앱이나 문서만 바뀌면 웹은 다시 배포하지 않는다
    paths-ignore: ['ios/**', 'docs/**', '.github/workflows/ios.yml','.github/workflows/testflight.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 드롭박스 동기화 앱 키: 저장소 Settings → Secrets and variables → Actions → Variables 의 DROPBOX_APP_KEY
          # (비밀값 아님, 없으면 동기화 꺼진 채로 배포)
          VITE_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
