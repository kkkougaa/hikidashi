# 아이폰 앱을 서명해서 TestFlight 에 올린다.
# 필요한 저장소 시크릿 (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       개발자 계정의 Team ID (10자리)
#   ASC_KEY_ID          App Store Connect API 키 ID
#   ASC_ISSUER_ID       App Store Connect API Issuer ID
#   ASC_KEY_P8_BASE64   내려받은 AuthKey_XXXX.p8 파일을 base64 로 바꾼 값
# 시크릿이 없으면 실패하지 않고 건너뛴다.
name: TestFlight

on:
  push:
    branches: [main]
    paths: ['ios/Hikidashi/**', 'ios/HikidashiCore/Sources/**', 'ios/project.yml', '.github/workflows/testflight.yml']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: 빌드해서 TestFlight 에 올리기
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # 드롭박스 동기화 앱 키 (Variables, 비밀값 아님). 없으면 동기화 꺼진 채로 빌드
      DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
    steps:
      - name: 시크릿 확인
        id: check
        run: |
          MISSING=""
          for n in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!n}" ]; then MISSING="$MISSING $n"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::notice::TestFlight 시크릿이 없어서 건너뛴다. 없는 것:$MISSING"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - name: 가장 새 Xcode 고르기
        if: steps.check.outputs.ready == 'true'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: API 키 놓기
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # .p8 내용을 그대로 넣었어도, base64 로 바꿔 넣었어도 받아준다
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" | tr -d '\r' > "$KEY"
            echo "키 형식: p8 원문"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$KEY" || true
            echo "키 형식: base64"
          fi
          # 값은 찍지 않고 모양만 확인
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY" || ! grep -q "END PRIVATE KEY" "$KEY"; then
            echo "::error::ASC_KEY_P8_BASE64 를 풀었는데 .p8 키 모양이 아니다 (BEGIN/END PRIVATE KEY 줄이 없음). 파일 전체를 다시 넣어줘"
            exit 1
          fi
          echo "키 줄 수: $(wc -l < "$KEY")"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: 번들 ID 등록 (App Store Connect 에 앱을 만들 수 있게)
        if: steps.check.outputs.ready == 'true'
        # 권한(capability)이 없는 앱은 Xcode 가 와일드카드 프로필(*)로 서명해서 번들 ID 를 따로 등록하지 않는다.
        # 그래서 API 로 직접 등록한다. 이미 있으면 그냥 넘어간다.
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          key = open(os.environ["ASC_KEY_PATH"]).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}
          # 앱과 공유 확장. App Group 은 아래 아카이브에서 Xcode 자동 서명이 붙인다
          for bid, name in [("com.kkkougaa.hikidashi", "hikidashi"), ("com.kkkougaa.hikidashi.share", "hikidashi share")]:
              q = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]=" + bid, headers=h)
              found = [d for d in json.load(urllib.request.urlopen(q))["data"] if d["attributes"]["identifier"] == bid]
              if found:
                  print("번들 ID 이미 있음:", bid)
                  continue
              body = {"data": {"type": "bundleIds", "attributes": {"identifier": bid, "name": name, "platform": "IOS"}}}
              try:
                  urllib.request.urlopen(urllib.request.Request("https://api.appstoreconnect.apple.com/v1/bundleIds", data=json.dumps(body).encode(), headers=h, method="POST"))
                  print("번들 ID 등록함:", bid)
              except urllib.error.HTTPError as e:
                  print("::error::번들 ID 등록 실패", bid, e.code, e.read().decode()[:500]); raise SystemExit(1)
          PY
      - name: CI 가 만든 개발 인증서 정리 (인증서 개수 한도)
        if: steps.check.outputs.ready == 'true'
        # CI 는 매번 새 맥에서 서명하느라 개발용 인증서를 새로 만든다. 쌓이면 팀 한도에 걸려 서명이 막히므로,
        # API 키로 만든 것("Created via API")만 지운다. 사람이 맥에서 만든 인증서와 배포용 인증서는 건드리지 않는다.
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          key = open(os.environ["ASC_KEY_PATH"]).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          h = {"Authorization": "Bearer " + token, "Content-Type": "application/json"}
          url = "https://api.appstoreconnect.apple.com/v1/certificates?limit=200&fields[certificates]=name,displayName,certificateType,expirationDate"
          try:
              certs = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=h)))["data"]
          except urllib.error.HTTPError as e:
              print("::warning::인증서 목록을 못 읽었다", e.code, e.read().decode()[:300]); raise SystemExit(0)
          dev = [c for c in certs
                 if c["attributes"].get("certificateType") in ("DEVELOPMENT", "IOS_DEVELOPMENT")
                 and "Created via API" in ((c["attributes"].get("name") or "") + " " + (c["attributes"].get("displayName") or ""))]
          print(f"개발 인증서 {sum(1 for c in certs if c['attributes'].get('certificateType') in ('DEVELOPMENT', 'IOS_DEVELOPMENT'))}개 중 CI 가 만든 것 {len(dev)}개를 지운다")
          for c in dev:
              a = c["attributes"]
              try:
                  urllib.request.urlopen(urllib.request.Request("https://api.appstoreconnect.apple.com/v1/certificates/" + c["id"], headers=h, method="DELETE"))
                  print("지움:", a.get("displayName") or a.get("name"), a.get("expirationDate"))
              except urllib.error.HTTPError as e:
                  print("::warning::못 지움", c["id"], e.code, e.read().decode()[:300])
          PY
      - name: 프로젝트 만들기
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: 아카이브
        if: steps.check.outputs.ready == 'true'
        run: |
          cd ios
          set -o pipefail
          # 빌드 번호는 이 워크플로가 돈 횟수 + 100 (항상 커진다)
          BUILD=$(( ${{ github.run_number }} + 100 ))
          xcodebuild archive -project Hikidashi.xcodeproj -scheme Hikidashi \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Hikidashi.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic DROPBOX_APP_KEY="$DROPBOX_APP_KEY" \
            CURRENT_PROJECT_VERSION="$BUILD" | tee ../archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" ../archive.log
          echo "빌드 번호 $BUILD" >> "$GITHUB_STEP_SUMMARY"
      - name: TestFlight 에 올리기
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hikidashi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee export.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "TestFlight 에 올렸다. App Store Connect 에서 처리가 끝나면 (10~30분) TestFlight 앱에 뜬다." >> "$GITHUB_STEP_SUMMARY"
      - name: 키 지우기
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-log
          path: |
            archive.log
            export.log

  ipa:
    name: 서명 안 한 ipa (SideStore·AltStore 용)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 가장 새 Xcode 고르기
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: 프로젝트 만들기
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: 빌드하고 ipa 로 묶기
        run: |
          cd ios
          set -o pipefail
          xcodebuild archive -project Hikidashi.xcodeproj -scheme Hikidashi -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 100 )) | grep -E "error:|\*\* ARCHIVE" || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          APP="$RUNNER_TEMP/ipa/Payload/Hikidashi.app"
          cp -R "$RUNNER_TEMP/Unsigned.xcarchive/Products/Applications/Hikidashi.app" "$RUNNER_TEMP/ipa/Payload/"
          ls "$APP/PlugIns"
          cd "$RUNNER_TEMP/ipa" && zip -qry ../hikidashi.ipa Payload
          ls -la "$RUNNER_TEMP/hikidashi.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: hikidashi-ipa
          path: ${{ runner.temp }}/hikidashi.ipa
